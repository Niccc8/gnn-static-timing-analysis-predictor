# Default Configuration - Optimized for Timing Violation Prediction

model:
  type: "HeterogeneousTimingGNN"
  in_channels: 10
  hidden_channels: 128
  num_classes: 2
  num_layers: 3
  attention_heads: 4
  dropout: 0.2
  edge_dim: 3

training:
  batch_size: 1                # Number of graphs per batch
  learning_rate: 0.001         # Adam learning rate
  weight_decay: 0.00001        # L2 regularization
  max_epochs: 100              # Maximum training epochs
  early_stop_patience: 20      # Early stopping patience
  class_weights: [1.0, 15.0]   # Class weights (optimized for 0.6% violations)
  gradient_clip: 1.0           # Gradient clipping

data:
  train_split: 0.6
  val_split: 0.2
  test_split: 0.2
  feature_dim: 10
  num_workers: 0

evaluation:
  metrics:
    - "roc_auc"
    - "pr_auc"
    - "f1_score"
    - "precision"
    - "recall"
    - " accuracy"
  cross_design: true
  per_design_breakdown: true

experiment:
  name: "gnn_timing_predictor"
  seed: 42
  save_predictions: true
  save_figures: true
